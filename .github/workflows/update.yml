name: Обновление данных и публикация

# Данные собирает сервер Timeweb (server/run-update.sh, cron каждые 10 мин) и пушит в main.
# Здесь — только публикация сайта на каждый пуш. Собрать данные силами GitHub —
# кнопка «Run workflow» с галочкой «update» (запасной вариант, если сервер недоступен;
# vsport отсюда не открывается — ФБЛ возьмётся из сохранённых страниц fbl/).
on:
  workflow_dispatch:
    inputs:
      update:
        description: "Собрать данные здесь (если сервер не работает)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Библиотеки для распознавания составов
        if: inputs.update
        run: npm install --no-audit --no-fund

      - name: Загрузка таблиц, матчей, статистики и VK
        if: inputs.update
        run: node update.js
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}

      - name: Сохранить обновлённые данные в репозиторий
        if: inputs.update
        run: |
          git config user.name "sadovod-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data-auto.js tg-cache.json lineups.json
          git diff --cached --quiet || (git commit -m "Обновление данных $(date -u +'%Y-%m-%d %H:%M')" && git push)

      - name: Подготовка сайта
        run: |
          mkdir _site
          cp *.html *.css *.js _site/
          cp -r img _site/
          # номер версии в ссылках, чтобы браузеры (особенно на телефонах) не держали старые файлы
          V=$(date +%s)
          for f in app.js data.js data-auto.js style.css; do
            sed -i "s|\"$f\"|\"$f?v=$V\"|g" _site/*.html
          done
          grep -h "v=$V" _site/index.html
          rm _site/update.js _site/live.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
